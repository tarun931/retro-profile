# Single-target RETRO-Profile: AGE ONLY.
#
# Why this is a separate model config rather than an override. `RetroProfile`
# derives `target_names` from `heads.keys()` and wraps them in an nn.ModuleDict,
# so a target has to be genuinely absent -- setting `heads.height: null` in an
# experiment override merges a None into the dict and ModuleDict rejects it.
# Hydra merges dicts rather than replacing them, so the height head can only be
# removed by composing a different model config.
#
# The scientific point (CLAUDE.md §5): the projector is SHARED across targets,
# so in the two-target model OrdCon must order one embedding space along an age
# axis and a height axis at the same time. Those axes are not independent --
# height correlates strongly with gender, age does not -- so the shared space is
# a compromise between them. With height removed the whole space is free to
# order along a single age axis, which is the configuration OrdCon was designed
# for in the first place.
#
# Everything else is identical to `retro_profile`, so the only difference is the
# absence of height.
name: retro_profile
_target_: retro_profile.models.RetroProfile

encoder:
  _target_: retro_profile.models.WavLMEncoder
  pretrained_name: microsoft/wavlm-base-plus
  freeze: true
  layer_aggregation: weighted
  output_dim: 768

pooling:
  _target_: retro_profile.models.MILAttentionPooling
  input_dim: 768
  hidden_dim: 256
  num_heads: 4
  dropout: 0.1
  gated: true
  target_names: [age]             # one attention stack, not two

heads:
  age:
    _target_: retro_profile.models.ResidualRetrievalHead
    input_dim: 256
    hidden_dim: 256
    output_dim: 1
    label_min: 18.0
    label_max: 80.0
    delta_clip: 6.0
    use_retrieval: true
    knn_k: 20

projector:
  _target_: retro_profile.models.MLPHead
  input_dim: 768
  hidden_dim: 512
  output_dim: 256
  num_hidden: 1
  dropout: 0.1
  l2_normalize: true

retrieval:
  _target_: retro_profile.retrieval.SearchConfig
  k: 20
  metric: cosine
  weighting: softmax_distance
  temperature: 0.1
