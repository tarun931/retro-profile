# @package _global_
# ABLATION ROW 2 -- + MIL attention pooling (Novelty 1).
# Row 1 with MIL instead of mean pooling. Still no OrdCon, no retrieval.
# Row 1 -> Row 2 answers RQ2 (does MIL beat simple averaging?).
defaults:
  - override /model: retro_profile
  - override /data: timit
  - override /training: default

run_name: ablation_2_mil_${data.name}

model:
  heads:                       # Novelty 3 still OFF
    age: {use_retrieval: false}
    height: {use_retrieval: false}

training:
  max_epochs: 60
  loss:
    ordcon_weight: 0.0         # Novelty 2 still OFF

data:
  max_audio_seconds: 4
  batch_size: 16
  bag_size: 8
  augmentation:
    enabled: false
