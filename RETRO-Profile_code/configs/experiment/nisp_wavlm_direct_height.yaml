# @package _global_
# CONTROL: plain WavLM + direct regression, HEIGHT ONLY, on NISP.
#
# Read against the NISP GENDER-MEAN LOOKUP of 5.20 cm, not against the other
# models. On NISP not one model beats that lookup and three are worse than it
# (§3.11), and the NISP paper's own Table 4 reproduces the same result with a
# non-neural system. If this control lands near 5.2 as well, that is the
# expected outcome and further evidence for the within-gender floor -- not a
# failed run.
#
# Submit with EVAL_CORPUS=nisp (see nisp_wavlm_direct.yaml).
defaults:
  - wavlm_direct_height_budget
  - override /data: nisp

run_name: nisp_wavlm_direct_height_${data.name}

data:
  targets: [height]
