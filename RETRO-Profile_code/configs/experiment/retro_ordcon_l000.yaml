# @package _global_
# OrdCon LAMBDA SWEEP -- ordcon_weight = 0.0.
#
# The question (priority list item 4): does OrdCon order the embedding space, or
# does fine-tuned WavLM already order it and OrdCon add nothing? lambda = 0 is
# the point that decides it.
#
# READ THE MECHANISM METRICS, NOT MAE. The metric that matters is
# `distance_spearman` from scripts/analyse_ordcon.py -- whether DISTANCE in the
# space tracks LABEL DIFFERENCE, which is the property retrieval actually
# consumes. In the existing runs `ordering_accuracy` is a healthy 0.69-0.73
# against 0.5 chance, but distance_spearman is only 0.22-0.44. Two independent
# measurements now say the same thing: the space is ordered along an axis while
# its neighbourhoods are not label-coherent. The offline temperature sweep
# (2026-09-14) found that sharpening the kNN weighting toward the most-similar
# neighbour makes the anchor WORSE on both encoders and both targets, and that
# the optimum weighting is essentially uniform -- i.e. similarity rank carries
# almost no information about label correctness.
#
# Inherits retro_noknn_budget, so this is a one-variable sweep against a run we
# already have: lambda = 0.3 IS `retro_noknn_budget_timit_s42`, already trained
# and evaluated. Do not re-run it. MIL pooling is KEPT deliberately -- the
# wavlm_direct_* controls changed lambda AND pooling together and so cannot
# separate the two; this sweep changes lambda alone.
#
# !! If lambda = 0: axis_pearson / axis_spearman / ordering_accuracy are NOT
# meaningful for this run. OrdConLoss is constructed unconditionally
# (losses/multitask.py:45) but only computed when ordcon_weight > 0 (line 74),
# so the learnable axis never receives a gradient and stays at random init.
# Those three metrics are measured ALONG that axis and will sit near chance by
# construction -- which is not evidence that the space is unordered. Read
# `distance_spearman`, which is computed from raw pairwise embedding distances
# and never touches the direction, so it is comparable across all five lambdas.
#
# Retrieval stays OFF during training, matching the parent. Anchor quality can
# still be measured afterwards from the trained checkpoint: both head branches
# are always constructed, and `residual` keeps its zero init when it never
# trains, so evaluating with retrieval flipped on gives delta == 0 and
# prediction == anchor exactly.
defaults:
  - retro_noknn_budget

run_name: retro_ordcon_l000_${data.name}

training:
  loss:
    ordcon_weight: 0.0
