# @package _global_
# TABLE 5, Jaid 2023 (2026-10-16): the final Table 1 Jaid (jaid2023_lr3e3: paper recipe, LR 3e-3, 3 s input, batch 64,
# up to 200 epochs with early stopping, gender extra task) trained on HeightCeleb + NISP. 10 fresh clips per speaker per
# epoch, as RETRO's groups of 10. Calibrated on the 70 TIMIT validation speakers. Seeds 42, 1, 2.
#
# Run with gupta_finetune.slurm, EXPERIMENT=heightceleb_nisp_jaid_lr3e3, EVAL_CORPUS=timit,
# TORCH_SHARING_STRATEGY=file_system.
defaults:
  - jaid2023_lr3e3
  - override /data: heightceleb_nisp

run_name: heightceleb_nisp_jaid_lr3e3_${data.name}

data:
  utts_per_speaker: 10
