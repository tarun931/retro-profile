# @package _global_
# TABLE 5, WavLM + MLP (2026-10-16): the final Table 1 baseline (wavlm_direct_budget_b10_e100: RETRO's setting without
# MIL, OrdCon and kNN; WavLM LR 1e-5; 100 epochs; groups of 10) trained on HeightCeleb + NISP. Settings unchanged from
# Table 1. Calibrated on the 70 TIMIT validation speakers like every Table 5 model. Seeds 42, 1, 2.
#
# Run with retro_finetune.slurm, EXPERIMENT=heightceleb_nisp_mlp_b10_e100, WITH_RETRIEVAL=0, EVAL_CORPUS=timit,
# EVAL_BAG_SIZE=10.
defaults:
  - wavlm_direct_budget_b10_e100
  - override /data: heightceleb_nisp

run_name: heightceleb_nisp_mlp_b10_e100_${data.name}

data:
  bag_size: 10
