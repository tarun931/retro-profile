# @package _global_
# OrdCon lambda 3.0 on the TIMIT base setting (2026-10-15).
#
# Identical to retro_ordcon_fixed_l100_s5 (the TIMIT base: two-target, MIL over clips, OrdCon scale 5, kNN off
# in training, 60 epochs) except lambda 1.0 -> 3.0. Why: the TIMIT lambda grid stopped at 1.0, and 1.0 won as its
# largest value; on HeightCeleb + NISP -> TIMIT, lambda 3.0 beat 1.0 and 10.0 on validation (E35). Choose lambda
# 1.0 vs 3.0 on TIMIT validation (val/combined_mae, the 70 dev speakers); test never used to choose.
#
# Run with retro_finetune.slurm, EXPERIMENT=retro_ordcon_fixed_l300_s5, WITH_RETRIEVAL=0, EVAL_CORPUS=timit.
defaults:
  - retro_ordcon_fixed_l100_s5

run_name: retro_ordcon_fixed_l300_s5_${data.name}

training:
  loss:
    ordcon_weight: 3.0
