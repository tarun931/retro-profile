# @package _global_
# BASELINE -- Gupta 2022, fine-tuned WavLM Base+, trained on HeightCeleb + NISP, tested on TIMIT
# (2026-10-12). Partner of heightceleb_nisp_l100_s5 (RETRO Run B): same training speakers
# (1,432), same validation (HeightCeleb dev, 122), same TIMIT test.
#
# Identical to gupta2022_finetune_wavlm (the TIMIT Gupta of the results table: per-utterance
# training, batch 8, 50 epochs, flat LR 1e-6, age + height + gender, 8 s) except the data, and one
# budget setting the new data forces: Gupta trains per clip, one pass over EVERY clip per epoch.
# On TIMIT that is 10 clips per speaker; on HeightCeleb + NISP it would be 151,045 clips per epoch
# (~13x the audio RETRO sees, ~2 days). utts_per_speaker: 8 draws 8 fresh clips per speaker each
# epoch (11,456) -- the audio RETRO's bags of 8 see. Agreed 2026-10-12.
#
# Run with gupta_finetune.slurm, EXPERIMENT=heightceleb_nisp_gupta_wavlm, EVAL_CORPUS=timit; the
# per-speaker score (the results table's protocol) comes from reevaluate.slurm afterwards.
defaults:
  - gupta2022_finetune_wavlm
  - override /data: heightceleb_nisp

run_name: heightceleb_nisp_gupta_wavlm_${data.name}

data:
  utts_per_speaker: 8
