# @package _global_
# RETRO-Profile with the TWO-PHASE curriculum -- the recipe that actually trains
# Novelty 3 (the kNN residual head).
#
#   Phase 1 (epochs 0-39): datastore empty -> heads run their direct MLP while
#     MIL pooling (Novelty 1) and OrdCon (Novelty 2) organize the embedding space.
#     The residual branch receives NO gradient in this phase.
#   Phase 2 (epochs 40+): the datastore is built from the train split and attached.
#     Heads switch to `anchor + residual`, the embedding path is frozen (so the
#     index stays valid), and the residual finally learns to correct the kNN
#     interpolation. Leave-one-out retrieval prevents self-label leakage.
#
# Evaluate the LAST checkpoint (phase 2), not the best-by-val from phase 1.
defaults:
  - override /model: retro_profile
  - override /data: timit
  - override /training: default

run_name: retro_two_phase_${data.name}

training:
  max_epochs: 70               # 40 epochs of phase 1 + up to 30 of phase 2
  two_phase:
    enabled: true
    # Phase 1 peaks around epoch ~33 on TIMIT and then drifts, so we give it 40
    # epochs and roll back to its BEST checkpoint at the switch (see
    # restore_best_phase1) -- that makes the exact value of start_epoch
    # uncritical. NOTE: the callback suspends EarlyStopping until this epoch;
    # otherwise phase 1 plateaus, early-stops, and phase 2 never runs at all.
    start_epoch: 40
    restore_best_phase1: true  # index phase 1's BEST embedding, not a drifted one
    freeze_embedding: true     # keep the indexed space stable during phase 2
    rebuild_every_n_epochs: 0  # not needed while the embedding path is frozen
    reset_early_stopping: true # phase 2 metrics start on a new scale
    # false = ModelCheckpoint keeps scoring across BOTH phases, so "best" is
    # usually a phase-1 model and you evaluate `last.ckpt` (the original
    # behaviour; keeps this experiment reproducible). Set true -- as
    # `ablation_4_full` does -- to select the best PHASE-2 checkpoint instead,
    # which makes the run directly comparable with single-phase runs.
    reset_checkpoint_best: false
  early_stopping:
    patience: 15               # applies to phase 2 (suspended during phase 1)

# Matched budget (identical to the Gupta-B comparison run).
data:
  max_audio_seconds: 4
  batch_size: 16
  bag_size: 8
  augmentation:
    enabled: false
