# @package _global_
# TABLE 5, RETRO (2026-10-16): the final Table 1 RETRO (retro_ordcon_fixed_l100_s5_b10: groups of 10 clips, OrdCon
# lambda 1.0 / scale 5, WavLM LR 1e-5 / rest 1e-4, 60 epochs) trained on HeightCeleb + NISP instead of TIMIT, exactly as
# Run B (heightceleb_nisp_l100_s5) but with groups of 10. Settings fixed on TIMIT validation (Table 1); nothing tuned
# for the cross-corpus test. Checkpoint chosen on HeightCeleb validation (training side). Then the cross-corpus second
# stage (fit_residual.py --train-from-run --calibrated) and the 2-number calibration on the 70 TIMIT validation speakers.
# Seeds 42, 1, 2.
#
# Run with retro_finetune.slurm, EXPERIMENT=heightceleb_nisp_b10_l100_s5, WITH_RETRIEVAL=0, EVAL_CORPUS=timit,
# EVAL_BAG_SIZE=10.
defaults:
  - heightceleb_nisp_l100_s5

run_name: heightceleb_nisp_b10_l100_s5_${data.name}

data:
  bag_size: 10
