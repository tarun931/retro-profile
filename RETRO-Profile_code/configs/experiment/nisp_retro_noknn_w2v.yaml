# @package _global_
# RETRO-Profile on NISP, wav2vec2, retrieval off.
#
# NISP arm of the cross-corpus comparison. Mirrors the TIMIT config of the same
# name; the ONLY change is the corpus, so any difference is the corpus.
#
# NISP vs TIMIT, and what it means for the budget:
#   * 168 train speakers against TIMIT's 392, so bag mode gets 42 optimizer
#     steps/epoch instead of 98. The 60-epoch budget gives ~2,520 steps against
#     TIMIT's 5,880 -- watch whether the selected epoch lands near the end again.
#   * ~41 English utterances per speaker against TIMIT's 10, so bags of 8 are
#     drawn from a far richer pool. This is the condition MIL was designed for
#     and TIMIT never provided.
#   * 8 s audio, matching every TIMIT run. NISP's median utterance is 8.8 s, so
#     this captures ~91% of it. The official NISP baseline truncates to 5 s.
#
# The published NISP baseline (shangeth/SpeakerProfiling) is NOT budget-matched
# to this: original wav2vec (not wav2vec2), 5 s, batch 128, lr 1e-3, per-utterance
# evaluation, and its label standardisation uses full-corpus statistics including
# the test speakers. Treat its numbers as a published reference row, the way Jaid
# 2023 is treated on TIMIT -- not as a controlled comparison.
defaults:
  - retro_w2v_noknn_budget
  - override /data: nisp

run_name: nisp_retro_noknn_w2v_${data.name}
