# @package _global_
# RETRO-Profile on wav2vec2 -- the encoder-controlled comparison against Gupta 2022.
#
# Why: every RETRO result so far uses WavLM Base+, while the validated Gupta 2022
# baseline uses wav2vec2-base. Any difference between them therefore confounds
# ARCHITECTURE with ENCODER, and the two cannot be separated. This run puts
# RETRO on Gupta's encoder so the remaining difference is the architecture alone.
#
# Everything else is inherited from retro_finetune, so the pair
# retro_finetune / retro_finetune_w2v is also a clean encoder A/B for RETRO
# itself: WavLM Base+ vs wav2vec2-base at an otherwise identical budget.
#
# NB: facebook/wav2vec2-base has feat_extract_norm == "group", meaning it was
# pretrained WITHOUT an attention mask. Wav2Vec2Encoder inherits the guard in
# WavLMEncoder that withholds the mask in that case; passing one would feed the
# model an input it never saw in pretraining. Padded frames are still excluded
# from the pooled embedding via the downsampled frame mask.
defaults:
  - retro_finetune

run_name: retro_finetune_w2v_${data.name}

model:
  encoder:
    _target_: retro_profile.models.Wav2Vec2Encoder
    pretrained_name: facebook/wav2vec2-base
    freeze: false
    gradient_checkpointing: true
    layer_aggregation: weighted    # 13 hidden states (1 conv + 12 transformer)
