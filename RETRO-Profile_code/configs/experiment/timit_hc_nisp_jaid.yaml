# @package _global_
# BASELINE -- Jaid & AbdulHassan 2023, trained on TIMIT + HeightCeleb + NISP, tested on TIMIT
# (2026-10-12, plan step 3b). Partner of timit_hc_nisp_l100_s5: same 1,824 training speakers, same
# validation (TIMIT dev, 70), same TIMIT test.
#
# Identical to jaid2023 except the data and utts_per_speaker: 8 (see heightceleb_nisp_gupta_wavlm.yaml).
#
# Run with gupta_finetune.slurm, EXPERIMENT=timit_hc_nisp_jaid, EVAL_CORPUS=timit; per-speaker score
# from reevaluate.slurm afterwards.
defaults:
  - jaid2023
  - override /data: timit_heightceleb_nisp

run_name: timit_hc_nisp_jaid_${data.name}

data:
  utts_per_speaker: 8
