# @package _global_
# JAID 2023, RECIPE B (2026-10-16): Jaid's model trained with RETRO's final TIMIT recipe: 40 clips per step,
# 60 epochs with no early stopping, AdamW weight decay 0.01, warm-up then cosine, learning rate 1e-4 (all of Jaid's
# layers are new; RETRO's new layers train at 1e-4). The model, its 3 s input, its MAE loss and gender extra task,
# the data and the checkpoint rule are unchanged. Compared with recipe A (jaid2023 / _lr3e4 / _lr3e3) on the
# 70 TIMIT validation speakers; the winner gets seeds 1-4.
#
# Run with gupta_finetune.slurm, EXPERIMENT=jaid2023_retrorecipe, EVAL_CORPUS=timit, TORCH_SHARING_STRATEGY=file_system.
defaults:
  - jaid2023

run_name: jaid2023_retrorecipe_${data.name}

data:
  batch_size: 40

training:
  max_epochs: 60
  early_stopping:
    enabled: false
  baseline:
    head_lr: 1.0e-4
    encoder_lr: 1.0e-4
    weight_decay: 1.0e-2
