# @package _global_
# TRAIN AND TEST ON HEIGHTCELEB ALONE (2026-10-12) -- the agreed base setting.
#
# Identical to retro_ordcon_fixed_l100_s5 except the data: HeightCeleb's official split, as in
# its paper -- train 1,089 speakers (502 with age), validation = dev 122 (56 with age, dated video
# only) chooses the checkpoint, test = the official 40 VoxCeleb1-test speakers (15 with age).
# Unlike heightceleb_full_l100_s5 (Run A), the 40 test speakers are NOT trained on.
#
# Manifests: data/heightceleb as built for Run A (--test-age-clips all), so the 15 aged test
# speakers carry ALL their clips under the dated video's age -- off by ~1-3 years for some clips
# (SESSION_HANDOFF §0.7.12); heights are exact. Age on 15 test speakers is indicative only.
#
# Run with retro_finetune.slurm, EXPERIMENT=heightceleb_only_l100_s5, WITH_RETRIEVAL=0,
# EVAL_CORPUS=heightceleb -> runs/heightceleb_only_l100_s5_heightceleb_s42.
# Partners: heightceleb_only_gupta_wavlm, heightceleb_only_jaid (same speakers and test).
defaults:
  - retro_ordcon_fixed_l100_s5
  - override /data: heightceleb

run_name: heightceleb_only_l100_s5_${data.name}
