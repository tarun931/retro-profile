# @package _global_
# Two-target RETRO + attention-concentration penalty, weight 2.0.
# One point on the sweep; see `retro_noknn_entlo` for the full rationale. These
# configs differ ONLY in `training.loss.attention_entropy_weight`.
defaults:
  - retro_noknn_budget

run_name: retro_noknn_enthi_${data.name}

training:
  loss:
    attention_entropy_weight: 2.0
