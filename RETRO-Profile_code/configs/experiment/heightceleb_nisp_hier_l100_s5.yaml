# @package _global_
# HIERARCHICAL ATTENTION on Run B's setting (2026-10-13): train HeightCeleb + NISP, calibrate on 70 TIMIT
# validation speakers, test on TIMIT.
#
# Identical to heightceleb_nisp_l100_s5 (Run B: lambda 1.0 / scale 5, MIL over clips, kNN off in training,
# 60 epochs, same data and budget) except ONE component: each clip is reduced over time by learned
# frame-level (temporal) attention instead of a plain mean -- frames within a clip (shared by both
# targets), then MIL over the clips (per target, unchanged).
#
# The frame scorer gets its own learning rate, 1e-3 (10x the head LR). At the head LR it never left the
# plain mean in E26 (TIMIT, 60 epochs, eff_share 1.000), so that run tested nothing. Zero-initialised:
# at step 0 the model equals Run B.
#
# Run with retro_finetune.slurm, EXPERIMENT=heightceleb_nisp_hier_l100_s5, WITH_RETRIEVAL=0,
# EVAL_CORPUS=timit; then reevaluate.slurm EVAL_SPLIT=val OUT_SUFFIX=_val for the calibration.
defaults:
  - heightceleb_nisp_l100_s5

run_name: heightceleb_nisp_hier_l100_s5_${data.name}

model:
  encoder:
    frame_pooling: attention
    frame_attention_hidden: 128
    frame_attention_dropout: 0.1

training:
  frame_attention_lr: 1.0e-3
