# @package _global_
# CONTROL: plain WavLM + direct regression, AGE ONLY, on NISP.
#
# Compare against nisp_retro_age_only (3.198, the best age on NISP) and against
# nisp_gupta_wavlm (3.709). Age is the trait where NISP's ordering agreed with
# TIMIT's, so this is the arm most likely to say something.
#
# Submit with EVAL_CORPUS=nisp (see nisp_wavlm_direct.yaml).
defaults:
  - wavlm_direct_age_budget
  - override /data: nisp

run_name: nisp_wavlm_direct_age_${data.name}

data:
  # Restated explicitly, as the existing nisp_retro_age_only does: the data
  # override brings in configs/data/nisp.yaml, whose own `targets` is
  # [age, height], and Hydra would otherwise merge that back over the
  # single-target list the parent set.
  targets: [age]
