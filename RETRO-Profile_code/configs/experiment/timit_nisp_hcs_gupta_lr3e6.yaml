# @package _global_
# TABLE 4b, Gupta 2022 (2026-10-17): the final Table 1 Gupta (gupta2022_finetune_wavlm_lr3e6: paper recipe, flat LR
# 3e-6, batch 8 clips, 50 epochs, gender extra task) trained on TIMIT + NISP + the age-balanced HeightCeleb split2 TRAINING sample. 10 fresh clips per speaker per epoch (all
# 10 for TIMIT speakers, as in Table 1), the same audio per epoch as RETRO's groups of 10. Calibrated on the 251
# HeightCeleb split2 dev speakers. Seeds 42, 1, 2.
#
# Run with gupta_finetune.slurm, EXPERIMENT=timit_nisp_hcs_gupta_lr3e6, EVAL_CORPUS=heightceleb_split2.
defaults:
  - gupta2022_finetune_wavlm_lr3e6
  - override /data: timit_nisp_hcsample

run_name: timit_nisp_hcs_gupta_lr3e6_${data.name}

data:
  utts_per_speaker: 10
