# @package _global_
# WAVLM + MLP baseline, learning-rate check (2026-10-16): wavlm_direct_budget_b10 with the WavLM learning rate
# 1e-5 -> 3.0e-5 (everything else unchanged). Lowest validation score among 3e-6 / 1e-5 / 3e-5 gets seeds 1-4.
#
# Run with retro_finetune.slurm, EXPERIMENT=wavlm_direct_budget_b10_enc3e5, WITH_RETRIEVAL=0, EVAL_CORPUS=timit,
# EVAL_BAG_SIZE=10.
defaults:
  - wavlm_direct_budget_b10

run_name: wavlm_direct_budget_b10_enc3e5_${data.name}

training:
  encoder_lr: 3.0e-5
