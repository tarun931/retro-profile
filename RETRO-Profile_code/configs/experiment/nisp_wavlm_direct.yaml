# @package _global_
# CONTROL: plain WavLM + direct regression, TWO TARGETS, on NISP.
#
# The NISP arm of `wavlm_direct_budget`, following exactly the pattern of
# nisp_retro_noknn_wavlm (inherit the TIMIT budget config, override the data
# module, nothing else) so the control is a one-variable A/B against §3.11.
#
# Note on `combined_normalisers`: these stay at TIMIT's chance levels
# (age 5.91 / height 7.40) rather than NISP's, exactly as the existing
# nisp_retro_* and nisp_gupta_* configs leave them. That is deliberate. They are
# a fixed rescaling inside the SELECTION metric only -- reported MAEs are
# unaffected -- and every NISP run to date used these values, so changing them
# here would make this control incomparable to the runs it exists to control for
# (rule R6). Do not "fix" this without re-running §3.11.
#
# Submit with EVAL_CORPUS=nisp. Without it the slurm script trains on NISP and
# evaluates on TIMIT -- that is bug §6.15, which silently produced four wrong-
# corpus runs on 2026-09-12.
defaults:
  - wavlm_direct_budget
  - override /data: nisp

run_name: nisp_wavlm_direct_${data.name}
