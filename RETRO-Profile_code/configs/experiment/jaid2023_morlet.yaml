# @package _global_
# Jaid 2023 with the continuous-wavelet (Morlet) initialisation instead of
# gammatone -- their second variant, 40 filters rather than 64 (their Sec. 3).
defaults:
  - override /model: baseline_jaid2023
  - override /data: timit
  - override /training: jaid

run_name: jaid2023_morlet_${data.name}

model:
  filterbank: morlet
  n_filters: 40

data:
  targets: [age, height, gender]
  train_unit: utterance
  max_audio_seconds: 3
  batch_size: 64
  bag_size: 8
  augmentation:
    enabled: false
