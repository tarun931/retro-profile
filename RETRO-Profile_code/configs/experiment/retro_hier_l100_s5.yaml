# @package _global_
# HIERARCHICAL ATTENTION (2026-10-11) on the agreed base setting.
#
# Identical to retro_ordcon_fixed_l100_s5 (lambda 1.0 / scale 5, two-target, MIL
# attention over clips, kNN retrieval OFF in training, 60 epochs, same budget)
# except for ONE change: each clip is reduced over time by learned frame-level
# attention instead of a plain mean. Attention is then hierarchical: frames
# within a clip (shared by both targets), then clips within the bag (per target,
# unchanged).
#
# The frame scorer is zero-initialised, so at step 0 this model is exactly the
# base model; any difference comes from what the frame attention learns.
#
# Compare against retro_ordcon_fixed_l100_s5_timit_s42 (epoch 59: 3.714 / 5.384,
# kNN at test 3.860 / 5.390), selected the same way on val/combined_mae.
# kNN at test, as for the base: reevaluate.slurm with WITH_RETRIEVAL=1
# FORCE_RETRIEVAL=1 OUT_SUFFIX=_knn.
defaults:
  - retro_ordcon_fixed_l100_s5

run_name: retro_hier_l100_s5_${data.name}

model:
  encoder:
    frame_pooling: attention
    frame_attention_hidden: 128
    frame_attention_dropout: 0.1
