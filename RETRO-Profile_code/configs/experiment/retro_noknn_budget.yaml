# @package _global_
# RETRO-Profile on WavLM, retrieval OFF for the whole run, budget-matched.
#
# Why this run exists. E13/E15 completed the matched 2x2 and Gupta won every
# cell. But the per-epoch curves showed the reason may not be the architecture:
#
#   E15 (WavLM)    phase 1 best ep 28: val age 3.786 / height 5.049
#                  phase 2 best ep 39: val age 3.824 / height 5.736
#   E13 (wav2vec2) phase 1 best ep 17: val age 4.063 / height 4.908
#                  phase 2 best ep 51: val age 3.837 / height 5.667
#
# Retrieval costs ~0.7 cm of height on BOTH encoders and is mixed on age. And
# `reset_checkpoint_best: true` clears ModelCheckpoint's tracker at the epoch-30
# switch, so those phase-1 epochs can never be selected -- the fix that
# guarantees a trained residual also guarantees we ship the worse half of the
# run. Those phase-1 height numbers are the best in the project and would beat
# Gupta's 5.129/5.158, though they are validation and not directly comparable.
#
# This config measures that properly: retrieval off from the start, so the
# direct branch trains for all 60 epochs at the same budget as E15. It is
# `retro_finetune_noknn` (the honest ablation) plus the E15 budget knobs, so
# retro_finetune_budget vs retro_noknn_budget is a one-variable A/B.
#
# Run this BEFORE the seed sweep. If phase 1 really is the better model, the
# seeds belong on this configuration, not on one we already suspect is
# handicapped.
defaults:
  - retro_finetune_noknn

run_name: retro_noknn_budget_${data.name}

data:
  # Gupta's cap; matches E13/E15 so the comparison is like-for-like.
  max_audio_seconds: 8.0

training:
  # 98 optimizer steps/epoch, as in the budget configs.
  accumulate_grad_batches: 1

  scheduler:
    warmup_steps: 200
