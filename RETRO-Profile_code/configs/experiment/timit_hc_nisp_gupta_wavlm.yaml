# @package _global_
# BASELINE -- Gupta 2022, fine-tuned WavLM Base+, trained on TIMIT + HeightCeleb + NISP, tested on TIMIT
# (2026-10-12, plan step 3b). Partner of timit_hc_nisp_l100_s5: same 1,824 training speakers, same
# validation (TIMIT dev, 70), same TIMIT test.
#
# Identical to gupta2022_finetune_wavlm except the data and utts_per_speaker: 8 -- 8 fresh clips per
# speaker each epoch (see heightceleb_nisp_gupta_wavlm.yaml for why); TIMIT speakers have 10 clips,
# so they too give 8 per epoch.
#
# Run with gupta_finetune.slurm, EXPERIMENT=timit_hc_nisp_gupta_wavlm, EVAL_CORPUS=timit; per-speaker
# score from reevaluate.slurm afterwards.
defaults:
  - gupta2022_finetune_wavlm
  - override /data: timit_heightceleb_nisp

run_name: timit_hc_nisp_gupta_wavlm_${data.name}

data:
  utts_per_speaker: 8
