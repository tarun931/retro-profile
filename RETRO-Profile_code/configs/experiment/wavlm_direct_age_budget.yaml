# @package _global_
# CONTROL: plain WavLM + direct regression, AGE ONLY, budget-matched.
#
# The single-task arm of `wavlm_direct_budget`. Compare against
# `retro_age_only_budget` (3.74 +/- 0.13, the best age in the project) to see
# how much of that comes from MIL + OrdCon rather than from the freed projector
# and the fine-tuned encoder.
#
# Inherits retro_age_only_budget, NOT wavlm_direct_budget: Hydra MERGES dicts,
# so inheriting a two-target config would resurrect a `height` key on top of the
# age-only model -- a head with no `_target_`, which RetroProfile's nn.ModuleDict
# then rejects. That trap is documented in retro_age_only_budget.yaml itself.
defaults:
  - retro_age_only_budget

run_name: wavlm_direct_age_budget_${data.name}

model:
  pooling:
    _target_: retro_profile.models.MeanPooling
    input_dim: 768

training:
  loss:
    ordcon_weight: 0.0
