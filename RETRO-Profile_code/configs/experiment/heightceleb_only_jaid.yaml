# @package _global_
# BASELINE -- Jaid & AbdulHassan 2023, trained and tested on HeightCeleb alone (2026-10-12).
# Partner of heightceleb_only_l100_s5: same official split (train 1,089 / dev 122 / test 40).
#
# Identical to jaid2023 except the data and utts_per_speaker: 8 -- 8 fresh clips per speaker each
# epoch instead of every clip (see heightceleb_nisp_gupta_wavlm.yaml for why).
#
# Run with gupta_finetune.slurm, EXPERIMENT=heightceleb_only_jaid, EVAL_CORPUS=heightceleb;
# per-speaker score from reevaluate.slurm afterwards.
defaults:
  - jaid2023
  - override /data: heightceleb

run_name: heightceleb_only_jaid_${data.name}

data:
  utts_per_speaker: 8
