# @package _global_
# GUPTA 2022, RECIPE B (2026-10-16): Gupta's model trained with RETRO's final TIMIT recipe.
#
# Recipe A is its paper recipe with the learning rate tuned on validation (gupta2022_finetune_wavlm_lr3e6:
# flat 3e-6, batch 8 clips, 50 epochs; validation 1.2790 at seed 42). Recipe B gives it RETRO's recipe instead:
# WavLM 1e-5 / new layers 1e-4 (AdamW, warm-up then cosine), 40 clips per step (RETRO: 4 speakers x 10 clips),
# 60 epochs, no early stopping. The model, its gender extra task, the data and the checkpoint rule are unchanged.
# The recipe with the lower validation score (val/combined_mae, same 70 speakers) gets seeds 1-4.
# Not matched: AdamW betas stay Gupta's code default (0.9, 0.999); RETRO uses (0.9, 0.98).
#
# Run with gupta_finetune.slurm, EXPERIMENT=gupta2022_finetune_wavlm_retrorecipe, EVAL_CORPUS=timit.
defaults:
  - gupta2022_finetune_wavlm

run_name: gupta2022_finetune_wavlm_retrorecipe_${data.name}

data:
  # 40 clips per optimiser step, as RETRO's 4 speakers x 10 clips -- fed 8 at a time and accumulated over 5 batches:
  # 40 at once ran out of GPU memory (job 61051631, 16 GiB request in the CNN feature extractor). Same gradient per
  # step, same 98 steps per epoch, same LR schedule (train.py divides total_steps by accumulate_grad_batches).
  batch_size: 8
  bag_size: 10                # per-speaker scoring on all 10 TIMIT clips

training:
  accumulate_grad_batches: 5
  max_epochs: 60
  gupta:
    encoder_lr: 1.0e-5
    head_lr: 1.0e-4
