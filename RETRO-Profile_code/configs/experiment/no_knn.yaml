# @package _global_
# Ablation: disable kNN retrieval; predict directly from MLP heads.
defaults:
  - override /model: retro_profile
  - override /data: timit
  - override /training: default

run_name: ablation_no_knn_${data.name}

model:
  heads:
    age:
      use_retrieval: false
    height:
      use_retrieval: false
