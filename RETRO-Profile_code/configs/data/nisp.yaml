# NISP multilingual speaker-profile corpus.
# 345 speakers, 5 Indian languages, age + height + weight + shoulder size.
name: nisp
_target_: retro_profile.data.NispDataModule

root: data/nisp
# Source audio is 48 kHz (the paper says 44.1 kHz; the release is 48 k).
# Resampled once on load -- prepare_nisp.py deliberately does not pre-resample.
sample_rate: 16000

# Measured on 200 random NISP clips: median 8.8 s, 90th percentile 13.3 s,
# max 24.4 s -- far longer than TIMIT's ~3 s. 8.0 keeps the budget IDENTICAL to
# every TIMIT run in this project, which is what makes the two corpora
# comparable, and still captures ~91% of the median utterance. Raising it to 12
# would cost ~50% more memory and compute for the tail.
max_audio_seconds: 8.0
min_audio_seconds: 0.5

bag_size: 8
batch_size: 16
num_workers: 4

# NISP also carries weight and shoulder_size; add them here to train on them.
targets: [age, height]
normalize_targets: true
# Matched case-insensitively (see data/nisp.py). prepare_nisp.py writes these
# capitalised, as the release names its directories. null = all languages.
languages: null

# OFF, matching every TIMIT run. Turning it on here would confound a
# cross-corpus comparison with an augmentation change (rule R6).
augmentation:
  enabled: false
  noise_prob: 0.3
  speed_perturb: [0.95, 1.05]
  spec_augment: true

splits:
  train: train
  val:   dev
  test:  test
