# HeightCeleb — VoxCeleb1's 1,251 speakers with crowd-sourced heights (heightceleb/HeightCeleb_Summary.pdf),
# plus our ages for 573 of them (heightceleb/vox1_height_age.csv; SESSION_HANDOFF §0.7.12).
# Manifests: scripts/prepare_heightceleb.py -> 1,089 train / 122 dev / 40 test speakers.
name: heightceleb
_target_: retro_profile.data.HeightCelebDataModule

root: data/heightceleb
sample_rate: 16000
# Measured on 2,000 random clips (unpack job 60929672): 16 kHz mono, median 6.5 s, 90th
# percentile 14.2 s, 35 % longer than 8 s. 8.0 keeps the budget IDENTICAL to every TIMIT and
# NISP run in this project.
max_audio_seconds: 8.0
min_audio_seconds: 0.5

bag_size: 8
batch_size: 16
num_workers: 4

# Height for every speaker; age for 573 (NaN otherwise -- the masked loss skips it).
targets: [age, height]
normalize_targets: true

# OFF, matching every TIMIT and NISP run. Turning it on would confound a cross-corpus
# comparison with an augmentation change (rule R6).
augmentation:
  enabled: false
  noise_prob: 0.3
  speed_perturb: [0.95, 1.05]
  spec_augment: true

splits:
  train: train
  val:   dev
  test:  test
